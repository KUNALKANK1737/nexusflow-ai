name: NexusFlow CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  repository-check:
    name: Repository Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository
        run: |
          echo "NexusFlow CI is running successfully."
          echo "Repository structure:"
          ls -la